<h2 id="merge-title">Merge Preview</h2>

<div class="merge-controls">
    <label for="mergeRecordInput" id="mergeRecordInputLbl" class="visually-hidden">ID</label>
    <input id="mergeRecordInput" placeholder="Enter ID" aria-label="Merge record number">
    <button id="mergeGoBtn">Merge</button><br><br>
    <button id="mergeLoadBtn">Load Selected Row</button>
    <button id="mergePrevBtn">Previous</button>
    <button id="mergeNextBtn">Next</button><br><br>
    <button id="mergeCopyBtn">Copy to Clipboard</button>
    <button id="mergeInsertBtn">Insert into Worksheet</button>
</div>

    <div id="mergeOutput" class="merge-output"></div>
